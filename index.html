<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>الديوان - إختر عطرك</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        /* Base Reset & Fonts */
        @font-face {
            font-family: NASKHFONT;
            src: url(nt-panorama-naskh-long.otf);
        }
        /* The Naskh font's digit glyphs are broken/invisible (western 0-9 and
           eastern-arabic ٠-٩ render blank). A second @font-face scoped to just
           those code points via unicode-range would be the "free" fix, but it
           only works if the fallback font is installed locally on the visitor's
           OS — Cairo here is loaded from Google Fonts, not installed locally,
           so that trick silently fails and digits stayed blank. The reliable
           fix lives in JS: see numFont() below, which wraps any digit run in
           a `.num-fix` span that explicitly forces Cairo, wherever numbers
           appear inside NASKHFONT-styled text (prices, sizes, totals). */
        @font-face {
            font-family: NASKHFONT;
            src: url(nt-panorama-naskh-long.otf);
        }
        .num-fix { font-family: 'Cairo', sans-serif; -webkit-text-fill-color: var(--gold, #dca74a); color: var(--gold, #dca74a); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; overflow-x: hidden; }
        
        body {
            background-color: #050402;
            background-image: radial-gradient(circle at 50% 20%, #302613 0%, #151109 45%, #050402 100%);
            background-attachment: fixed;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-weight: 400;
            overflow-x: hidden;
        }
        body.no-scroll { overflow: hidden; }

        /* Dynamic Header */
        .top-glass-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 200px;
            background: linear-gradient(to bottom, rgba(5, 4, 2, 0.95) 0%, rgba(5, 4, 2, 0.6) 60%, transparent 100%);
            z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.8s ease;
        }
        .top-glass-bar.visible { opacity: 1; }

        .logo-wrap {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(1.6);
            z-index: 100; transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1); pointer-events: none;
        }
        .logo-wrap img { max-width: 160px; height: auto; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.5)); }
        .logo-wrap.moved { top: 4%; transform: translate(-50%, 0) scale(1); }
        .logo-wrap.scrolled { top: 1%; transform: translate(-50%, 0) scale(0.65); }

        /* Hero Section */
        .store-container { position: relative; width: 100vw; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
        .fade-in { opacity: 0; filter: blur(20px); transform: scale(0.95); transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1); }
        .fade-in.visible { opacity: 1; filter: blur(0); transform: scale(1); }

        .top-text { position: absolute; top: 22%; font-size: 4rem; color: #dca74a; font-weight: 600; letter-spacing: 2px; z-index: 10; font-family: 'NASKHFONT', serif; }

        .bottles-stage { position: absolute; bottom: 22%; width: 100%; height: 50vh; display: flex; justify-content: center; align-items: flex-end; z-index: 5; }
        .bottle { position: absolute; bottom: 0; left: 50%; transform-origin: bottom center; opacity: 0; filter: drop-shadow(0 0 0 rgba(0,0,0,0)) blur(25px); transition: all 1.4s cubic-bezier(0.21, 1.11, 0.81, 0.99); }
        .b-front { height: 48vh; z-index: 5; transform: translate(-50%, 20px) scale(0.8); }
        .b-mid { height: 42vh; z-index: 4; }
        .b-back { height: 38vh; z-index: 3; }
        .b-mid.left, .b-mid.right, .b-back.left, .b-back.right { transform: translate(-50%, 20px) scale(0.8); }

        .bottle.visible { opacity: 1; filter: drop-shadow(0 25px 25px rgba(0,0,0,0.6)) blur(0px); }
        .b-front.visible { transform: translate(-50%, 0) scale(1); }
        .b-mid.left.visible { transform: translate(-105%, 0) scale(1); }
        .b-mid.right.visible { transform: translate(5%, 0) scale(1); }
        .b-back.left.visible { transform: translate(-140%, 0) scale(1); }
        .b-back.right.visible { transform: translate(40%, 0) scale(1); }

        .bottom-content { position: absolute; bottom: 4%; text-align: center; z-index: 10; width: 100%; }
        .discover-text { font-family: 'NASKHFONT', serif; font-size: 3.5rem; line-height: 1.1; margin-bottom: -5px; color: #ffffff; text-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .order-text {font-family: 'NASKHFONT', serif; font-size: 1.8rem; font-weight: 800; color: #ffffff; margin-bottom: 20px; }
        .swipe-up { font-size: 0.9rem; color: #a3a3a3; display: flex; flex-direction: column; align-items: center; gap: 5px; animation: bounce 2s infinite ease-in-out; }
        .swipe-up svg { width: 24px; height: 24px; fill: #a3a3a3; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        /* Products Section */
        .products-section { width: 100vw; min-height: 100vh; padding-top: 15vh; display: flex; flex-direction: column; align-items: center; padding-bottom: 100px; }
        .section-title { font-family: 'NASKHFONT', serif; font-size: 3.5rem; color: #dca74a; margin-bottom: 100px; text-shadow: 0 4px 10px rgba(0,0,0,0.8); opacity: 0; transform: translateY(30px); filter: blur(12px); transition: all 1s cubic-bezier(0.25, 1, 0.5, 1); }
        .reveal-visible { opacity: 1; transform: translateY(0); filter: blur(0); }

        .cards-container { display: flex; flex-direction: column; gap: 90px; width: 92%; max-width: 550px; }

        /* Perfume Base Card (Front Only) */
        .perfume-card {
            opacity: 0; transform: translateY(40px); filter: blur(15px);
            transition: opacity 1.2s, transform 1.2s, filter 1.2s, opacity 0.4s ease;
            height: 380px; position: relative;
            background: linear-gradient(145deg, rgba(30, 25, 15, 0.95), rgba(10, 8, 5, 0.98));
            border-radius: 20px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 15px 30px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; padding: 10px 15px 20px 15px;
            border: 1px solid rgba(220, 167, 74, 0.4);
            cursor: pointer;
        }
        .perfume-card.reveal-visible { opacity: 1; transform: translateY(0); filter: blur(0); }
        .perfume-card:active { transform: scale(0.97); }
        
        .card-content-front { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; padding-top: 10px; flex: 1; }
        .bottle-col { display: flex; flex-direction: column; align-items: center; width: 35%; }
        .bottle-img-wrapper { margin-top: -65px; display: flex; justify-content: center; position: relative; z-index: 10; }
        .bottle-img { height: 250px; width: auto; object-fit: contain; filter: drop-shadow(0 15px 15px rgba(0,0,0,0.7)); mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%); -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 80%, rgba(0,0,0,0) 100%); }
        .bottle-name { font-size: 1.1rem; color: #ffffff; text-align: center; line-height: 1.3; text-shadow: 0 2px 5px rgba(0,0,0,1); position: relative; z-index: 15; margin-top: -20px; font-weight: bold; }
        .arrow-col { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 30%; margin-top: 25px; }
        .alt-text { font-family: 'NASKHFONT', serif; font-size: 2.2rem; color: #ffffff; margin-bottom: -8px; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }
        .alt-arrow svg { width: 85px; height: 25px; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.8)); }

        .card-action-container { text-align: center; margin-top: auto; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(220, 167, 74, 0.5)); pointer-events: none; }
        .learn-more-text { font-family: 'NASKHFONT', sans-serif; font-size: 1.8rem; display: inline-block; background: linear-gradient(110deg, #dca74a 20%, #ffffff 50%, #dca74a 80%); background-size: 200% auto; color: #000; background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: lightSweep 3s linear infinite; }

        /* MODAL BACKDROP */
        #modal-backdrop {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            z-index: 999; opacity: 0; pointer-events: none; transition: opacity 0.5s ease;
        }
        #modal-backdrop.active { opacity: 1; pointer-events: all; }

        /* POPUP MODAL (THE BACK OF THE CARD) */
        #perfume-modal {
            position: fixed;
            background: linear-gradient(180deg, #1a150e 0%, #050402 100%);
            border: 1px solid rgba(220, 167, 74, 0.6);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(0,0,0,0.5);
            z-index: 1000;
            display: none; /* Displayed via JS */
            flex-direction: column;
            overflow: hidden;
            /* Dimensions are controlled perfectly by JS for the transition */
        }

        .modal-inner-scroll { flex: 1; overflow-y: auto; overflow-x: hidden; padding-bottom: 120px; }

        /* Modal Close Button */
        .close-btn {
            position: absolute; top: 15px; left: 15px; width: 40px; height: 40px;
            background: rgba(220, 167, 74, 0.1); border: 1px solid #dca74a; color: #dca74a;
            border-radius: 50%; font-size: 1.5rem; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 50; transition: all 0.45s var(--ios-ease);
        }
        .close-btn:hover, .close-btn:active { background: #dca74a; color: #000; transform: scale(0.9); }

        /* Modal Header */
        .modal-header { padding: 40px 20px 15px 20px; display: flex; justify-content: space-between; align-items: flex-start; }
        .modal-title { font-family: 'NASKHFONT', serif; color: #fff; font-size: 2.6rem; text-shadow: 0 0 15px rgba(220,167,74,0.6); line-height: 1.1; flex: 1; padding-right: 15px; text-align: right; }
        .modal-title small { display: block; font-size: 1rem; color: #bbb; font-family: 'Cairo', sans-serif; text-shadow: none; margin-top: 5px; }
        .modal-bottle { height: 160px; object-fit: contain; filter: drop-shadow(0 15px 20px rgba(0,0,0,0.9)); margin-left: 10px; }

        /* Modal Detail Tags */
        .detail-tags { display: flex; gap: 10px; padding: 0 25px 15px 25px; }
        .d-tag { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 20px; font-size: 0.85rem; color: #ccc; display: flex; align-items: center; gap: 5px; }
        .d-tag svg { width: 14px; height: 14px; fill: #dca74a; }

        /* Modal Tabs */
        .tabs-container { display: flex; justify-content: center; gap: 15px; padding: 0 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tab-btn { background: none; border: none; color: #888; font-family: 'Cairo', sans-serif; font-size: 1.1rem; font-weight: 600; padding: 10px 15px; cursor: pointer; transition: all 0.3s ease; position: relative; }
        .tab-btn.active { color: #fff; }
        .tab-btn.active::after { content: ''; position: absolute; bottom: -1px; left: 0; width: 100%; height: 2px; background: #dca74a; box-shadow: 0 0 10px #dca74a; }
        .tab-content { display: none; padding: 25px 20px; color: #ddd; font-size: 1.05rem; line-height: 1.8; text-align: justify; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Accords Bar */
        .accords-wrap { margin-bottom: 35px; }
        .sec-title { font-size: 1.2rem; color: #dca74a; margin-bottom: 15px; border-bottom: 1px dashed rgba(220,167,74,0.3); padding-bottom: 5px; }
        .accord-row { display: flex; align-items: center; margin-bottom: 10px; }
        .accord-bar-container { flex: 1; background: #222; height: 26px; border-radius: 4px; overflow: hidden; margin-left: 10px; border: 1px solid #111; }
        .accord-bar { height: 100%; display: flex; align-items: center; padding-right: 12px; font-size: 0.85rem; font-weight: bold; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        /* NEW BLOCKS PYRAMID */
        .blocks-pyramid { display: flex; flex-direction: column; align-items: center; gap: 12px; margin: 20px 0 30px 0; width: 100%; position: relative; }
        /* Vertical connecting line */
        .blocks-pyramid::before { content: ''; position: absolute; top: 10px; bottom: 10px; left: 50%; width: 2px; background: rgba(220,167,74,0.2); z-index: 1; }
        
        .block-tier { 
            display: flex; align-items: center; padding: 12px 20px; border-radius: 12px;
            background: linear-gradient(135deg, rgba(42, 34, 22, 0.95), rgba(17, 14, 10, 0.95));
            border: 1px solid rgba(220,167,74,0.5);
            box-shadow: 0 6px 15px rgba(0,0,0,0.6);
            z-index: 2; position: relative;
        }
        .block-top { width: 65%; }
        .block-mid { width: 80%; }
        .block-base { width: 95%; }
        
        .tier-icon-wrap { width: 35px; height: 35px; background: rgba(220,167,74,0.1); border-radius: 50%; display: flex; justify-content: center; align-items: center; margin-left: 15px; border: 1px solid rgba(220,167,74,0.3); }
        .tier-icon-wrap svg { width: 20px; height: 20px; fill: #dca74a; color: #dca74a; }
        
        .tier-content { display: flex; flex-direction: column; flex: 1; }
        .tier-label { font-size: 0.8rem; color: #aaa; margin-bottom: 2px; }
        .tier-notes { font-size: 0.95rem; color: #fff; font-weight: 700; }

        /* Gender tag (worn-by) */
        .gender-symbol { color: var(--gold, #dca74a); font-weight: 800; font-size: 1rem; display: inline-block; }

        /* Modal Purchase Bar — now a column: price row on top, buttons row below */
        .purchase-bar { position: absolute; bottom: 0; left: 0; width: 100%; padding: 10px 20px 15px 20px; background: rgba(5,4,2,0.98); border-top: 1px solid rgba(220, 167, 74, 0.3); display: flex; flex-direction: column; gap: 8px; z-index: 100; }
        .purchase-bar-price { text-align: center; font-size: 0.95rem; color: #ccc; pointer-events: none; }
        .purchase-bar-price .glow-sweep-text { font-size: 1.05rem; }
        .purchase-bar-actions { display: flex; gap: 15px; }
        .btn-order { flex: 2; background: linear-gradient(135deg, #dca74a, #b3802e); color: #000; border: none; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 1.3rem; font-weight: 800; cursor: pointer; transition: transform 0.2s; }
        .btn-order:active { transform: scale(0.96); }
        .btn-cart { flex: 1; background: #2a2216; color: #dca74a; border: 1px solid #dca74a; border-radius: 8px; font-family: 'Cairo', sans-serif; font-size: 1rem; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; padding: 5px 0; transition: all 0.2s; }
        .btn-cart svg { width: 20px; height: 20px; fill: #dca74a; margin-bottom: 3px; }
        .btn-cart:active { background: #dca74a; color: #000; }
        .btn-cart:active svg { fill: #000; }

        /* ============ iOS-SMOOTH GLOBAL HELPERS ============ */
        :root {
            --ios-ease: cubic-bezier(0.22, 0.61, 0.16, 1);
            --ios-ease-soft: cubic-bezier(0.22, 1, 0.36, 1);
            --ios-pop: cubic-bezier(0.19, 0.86, 0.24, 1.06);
            --gold: #dca74a;
        }
        button, .perfume-card, .tab-btn, .close-btn, .btn-order, .btn-cart,
        .size-bottle-card, .type-pill, .order-submit-btn, .combo-item, .btn-back-order {
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.55s var(--ios-ease), filter 0.55s var(--ios-ease), background 0.55s var(--ios-ease), box-shadow 0.55s var(--ios-ease), opacity 0.55s var(--ios-ease);
        }
        button:active, .perfume-card:active, .size-bottle-card:active, .type-pill:active, .order-submit-btn:active {
            filter: brightness(0.92);
        }

        /* Glowing sweep text (used for order selections) */
        @keyframes lightSweep { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        .glow-sweep-text {
            font-family: 'NASKHFONT', 'Cairo', sans-serif;
            font-size: 1.35rem;
            display: inline-block;
            background: linear-gradient(110deg, var(--gold) 20%, #ffffff 50%, var(--gold) 80%);
            background-size: 200% auto;
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: lightSweep 2.4s linear infinite;
            filter: drop-shadow(0 0 12px rgba(220,167,74,0.55));
            text-align: center;
        }

        /* ============ Site credit badge (free-floating text, bottom-left corner) ============ */
        .site-credit {
            position: fixed; bottom: 20px; left: 18px; z-index: 400;
            cursor: pointer; user-select: none; direction: ltr;
            opacity: 0; transform: translateY(10px);
            transition: opacity 0.9s ease, transform 0.9s ease, filter 0.6s ease, bottom 0.5s ease;
        }
        .site-credit.credit-visible { opacity: 1; transform: translateY(0); }
        .site-credit.credit-hidden { opacity: 0; filter: blur(10px); transform: translateY(10px); pointer-events: none; }
        .site-credit-text {
            font-family: 'NASKHFONT', 'Cairo', sans-serif;
            font-size: 0.95rem; font-weight: 700; letter-spacing: 0.3px;
            display: inline-block; white-space: nowrap;
            background: linear-gradient(110deg, var(--gold) 20%, #ffffff 50%, var(--gold) 80%);
            background-size: 200% auto;
            background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: lightSweep 2.6s linear infinite;
            filter: drop-shadow(0 0 10px rgba(220,167,74,0.5));
            transition: opacity 0.45s ease, filter 0.45s ease;
        }
        .site-credit-text.credit-swap-out { opacity: 0; filter: blur(6px); }
        /* Smaller / dimmer version — shown whenever the badge re-appears after the
           first time (i.e. any scroll-back-to-top that isn't the very first load) */
        .site-credit.credit-small { bottom: 14px; }
        .site-credit.credit-small .site-credit-text { font-size: 0.7rem; animation-duration: 4.5s; filter: drop-shadow(0 0 4px rgba(220,167,74,0.25)); }


        /* ============ Bottom contact footer (true end of the page) ============ */
        .site-footer-credit {
            width: 100%; padding: 60px 20px 50px; text-align: center;
            border-top: 1px solid rgba(220,167,74,0.15);
            display: flex; flex-direction: column; align-items: center; gap: 10px;
        }
        .site-footer-credit .ftc-line1 { font-family: 'NASKHFONT', serif; font-size: 1.4rem; color: #fff; }
        .site-footer-credit .ftc-msg { font-size: 0.95rem; color: #ccc; max-width: 420px; line-height: 1.8; margin: 8px 0 12px; }
        .site-footer-credit .ftc-contact { display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; font-size: 0.95rem; }
        .site-footer-credit .ftc-contact a {
            color: #fff; text-decoration: none; border: 1px solid rgba(220,167,74,0.35);
            padding: 9px 18px; border-radius: 999px; transition: all 0.3s ease; direction: ltr; display: inline-block;
        }
        .site-footer-credit .ftc-contact a:hover { background: rgba(220,167,74,0.12); border-color: var(--gold); }

        /* Social media links (Facebook / TikTok) — round icon buttons */
        .ftc-social { display: flex; justify-content: center; gap: 16px; }
        .ftc-social a {
            width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            background: rgba(220,167,74,0.08); border: 1px solid rgba(220,167,74,0.35); color: var(--gold);
            transition: all 0.3s ease;
        }
        .ftc-social a:hover { background: var(--gold); color: #000; transform: translateY(-3px); box-shadow: 0 8px 18px rgba(220,167,74,0.4); }
        .ftc-social a svg { width: 22px; height: 22px; fill: currentColor; }

        /* ============ ORDER OVERLAY (centered card, like the perfume modal) ============ */
        #order-overlay {
            position: fixed; z-index: 2000;
            background: linear-gradient(180deg, #1a150e 0%, #050402 100%);
            border: 1px solid rgba(220,167,74,0.6);
            border-radius: 22px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95), inset 0 0 30px rgba(0,0,0,0.5);
            display: none; flex-direction: column;
            overflow: hidden;
            top: 50%; left: 50%;
            width: min(94vw, 520px);
            height: min(90vh, 800px);
            transform: translate(-50%, -50%) scale(0.9);
            opacity: 0;
            transition: transform 0.65s var(--ios-pop), opacity 0.45s ease-out;
        }
        #order-overlay.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        #order-overlay-backdrop-blur {
            position: fixed; inset: 0; z-index: 1999; background: rgba(0,0,0,0.92);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #order-overlay-backdrop-blur.active { opacity: 1; pointer-events: all; }

        .order-header {
            display: flex; align-items: center; gap: 12px; padding: 18px 16px 14px 16px;
            border-bottom: 1px solid rgba(220,167,74,0.25);
            background: rgba(5,4,2,0.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            position: sticky; top: 0; z-index: 20;
            border-radius: 22px 22px 0 0;
        }
        .btn-back-order {
            width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--gold);
            background: rgba(220,167,74,0.08); color: var(--gold); font-size: 1.3rem;
            display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
        }
        .order-header-title { flex: 1; text-align: right; }
        .order-header-title h3 { font-family: 'NASKHFONT', serif; font-size: 1.5rem; color: #fff; }
        .order-header-title small { color: #999; font-size: 0.8rem; }

        .order-scroll { flex: 1; overflow-y: auto; padding: 20px 16px 24px 16px; -webkit-overflow-scrolling: touch; }

        /* Pinned footer — sibling of .order-scroll, always at the true bottom of the
           card regardless of how much content is in the scroll area above it. */
        .order-footer {
            flex-shrink: 0; display: flex; align-items: center; gap: 14px;
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)) 16px;
            border-top: 1px solid rgba(220,167,74,0.25);
            background: rgba(5,4,2,0.98);
            border-radius: 0 0 22px 22px;
        }
        .order-footer .order-submit-btn { position: static; margin-top: 0; flex: 1; }
        .order-footer-price { flex: 0 0 auto; min-width: 84px; text-align: center; font-size: 0.95rem; color: #ccc; line-height: 1.3; }
        .order-footer-price .glow-sweep-text { font-size: 1.1rem; }
        .order-footer-price .price-strike { display: block; text-decoration: line-through; color: #888; font-size: 0.78rem; }
        .order-footer-price .coupon-badge { display: block; font-size: 0.65rem; color: #4cd964; margin-top: 2px; }
        .order-footer-price .price-breakdown, .cart-drawer-footer-price .price-breakdown, .purchase-bar-price .price-breakdown {
            display: block; font-size: 0.68rem; color: #999; margin-top: 2px;
        }

        .order-section-label {
            font-size: 1.05rem; color: var(--gold); margin: 22px 0 12px 0; font-weight: 800;
            display: flex; align-items: center; gap: 8px;
        }
        .order-section-label:first-child { margin-top: 0; }

        /* Type toggle (تقسيم / العبوة الكاملة) */
        .type-toggle-row { display: flex; gap: 10px; }
        .type-pill {
            flex: 1; padding: 14px 10px; border-radius: 14px; text-align: center; cursor: pointer;
            background: linear-gradient(145deg, rgba(30,25,15,0.9), rgba(10,8,5,0.95));
            border: 1px solid rgba(220,167,74,0.35); color: #ccc; font-weight: 700; font-size: 0.98rem;
        }
        .type-pill.selected {
            border-color: var(--gold); color: #fff;
            box-shadow: 0 0 22px rgba(220,167,74,0.45), inset 0 0 12px rgba(220,167,74,0.15);
            background: linear-gradient(145deg, rgba(60,45,20,0.95), rgba(20,15,8,0.98));
        }

        /* Delivery price hint — shown once wilaya + delivery type are both picked */
        .delivery-price-note {
            text-align: center; margin-top: 10px; padding: 10px 12px; border-radius: 12px;
            font-size: 0.9rem; font-weight: 700; color: var(--gold);
            background: rgba(220,167,74,0.08); border: 1px solid rgba(220,167,74,0.3);
        }
        .delivery-price-note:empty { display: none; padding: 0; border: none; margin-top: 0; }
        .delivery-price-note--pending { color: #ddd; font-weight: 600; font-size: 0.85rem; }

        /* Decant bottle-size picker */
        .sizes-instruction { text-align: center; color: #aaa; font-size: 0.9rem; margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .sizes-instruction .arrow-bounce { animation: bounce 1.6s infinite ease-in-out; font-size: 1.1rem; }
        .sizes-row { display: flex; align-items: flex-start; justify-content: center; gap: 18px; margin-top: 14px; }
        .size-bottle-card {
            display: flex; flex-direction: column; align-items: center; gap: 10px; cursor: pointer;
            transform: scale(0.96); transition: transform 0.3s var(--ios-ease);
        }
        .size-bottle-card.selected { transform: scale(1.06); }
        /* Fixed-height crop window: bottles are big & noticeable, but only the top
           portion (cap + shoulder) shows — the rest fades into the section below. */
        .bottle-visual-crop {
            position: relative; width: 100%; height: 150px; overflow: hidden;
            display: flex; justify-content: center; align-items: flex-start;
        }
        .bottle-visual-crop svg { flex-shrink: 0; transition: opacity 0.25s ease, filter 0.25s ease, transform 0.25s ease; }
        .bottle-visual-crop::after {
            content: ''; position: absolute; left: -8px; right: -8px; bottom: 0; height: 50%;
            background: linear-gradient(to bottom, rgba(12,9,5,0) 0%, rgba(12,9,5,0.7) 60%, #0c0905 100%);
            pointer-events: none;
        }
        /* Only the bottle graphic itself dims/blurs when NOT selected — labels & price stay fully readable */
        .size-bottle-card:not(.selected) .bottle-visual-crop svg { opacity: 0.42; filter: grayscale(0.4) blur(0.5px); transform: translateY(2px) scale(0.96); }
        .size-bottle-card.selected .bottle-visual-crop svg { opacity: 1; filter: drop-shadow(0 0 16px rgba(220,167,74,0.6)); transform: translateY(-4px) scale(1.04); }
        .size-label-badge {
            font-size: 0.98rem; font-weight: 800; color: #eee; background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; padding: 5px 16px;
        }
        .size-bottle-card.selected .size-label-badge { color: #000; background: var(--gold); border-color: var(--gold); box-shadow: 0 0 14px rgba(220,167,74,0.5); }
        .size-price { font-size: 0.85rem; color: #ccc; }
        .size-bottle-card.selected .size-price { color: var(--gold); font-weight: 700; }

        /* Full bottle picker — floating presentation (this option isn't always available) */
        .full-bottle-wrap { display: flex; flex-direction: column; align-items: center; margin-top: 18px; position: relative; }
        .full-bottle-badge {
            font-size: 0.8rem; color: var(--gold); border: 1px solid rgba(220,167,74,0.4);
            background: rgba(220,167,74,0.08); padding: 3px 12px; border-radius: 20px; margin-bottom: 14px;
        }
        .full-bottle-floater { position: relative; display: flex; justify-content: center; }
        .full-bottle-floater::after {
            content: ''; position: absolute; bottom: -6px; left: 50%; width: 90px; height: 16px;
            background: radial-gradient(ellipse, rgba(0,0,0,0.55) 0%, transparent 70%);
            transform: translateX(-50%); animation: floatShadow 3.2s ease-in-out infinite;
        }
        .full-bottle-wrap img {
            height: 240px; object-fit: contain; cursor: pointer;
            filter: drop-shadow(0 20px 18px rgba(0,0,0,0.55)) drop-shadow(0 0 24px rgba(220,167,74,0.35));
            animation: floatBottle 3.2s ease-in-out infinite;
        }
        @keyframes floatBottle {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-14px); }
        }
        @keyframes floatShadow {
            0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.55; }
            50% { transform: translateX(-50%) scale(0.75); opacity: 0.3; }
        }
        .full-bottle-price { margin-top: 14px; color: var(--gold); font-weight: 700; }

        /* One-time shine sweep across the bottle when the user taps "العبوة الكاملة" */
        .full-bottle-shine-wrap { position: relative; overflow: hidden; border-radius: 18px; padding: 22px 14px 32px 14px; margin: -22px -14px -32px -14px; }
        .full-bottle-shine-wrap::before {
            content: ''; position: absolute; top: 0; left: -60%; width: 45%; height: 100%;
            background: linear-gradient(100deg, transparent 0%, rgba(255,255,255,0.75) 50%, transparent 100%);
            transform: skewX(-18deg); opacity: 0; pointer-events: none;
        }
        .full-bottle-shine-wrap.shine::before { animation: bottleShineSweep 1.1s ease-in-out; }
        @keyframes bottleShineSweep {
            0%   { left: -60%; opacity: 0; }
            15%  { opacity: 0.9; }
            55%  { opacity: 0.9; }
            100% { left: 130%; opacity: 0; }
        }
        /* After the shine, the option settles into a locked "coming soon" state */
        .full-bottle-wrap.coming-soon img { animation: none; }
        .full-bottle-wrap.coming-soon .full-bottle-floater {
            transition: filter 1s var(--ios-ease-soft), opacity 1s var(--ios-ease-soft);
        }
        .full-bottle-wrap.coming-soon.locked .full-bottle-floater {
            filter: blur(4px) grayscale(0.5) brightness(0.55);
            opacity: 0.6;
        }
        .coming-soon-badge {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8);
            background: rgba(5,4,2,0.85); border: 1px solid var(--gold); color: var(--gold);
            font-weight: 800; font-size: 1rem; padding: 10px 20px; border-radius: 30px;
            white-space: nowrap; opacity: 0; pointer-events: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: opacity 0.8s var(--ios-ease-soft) 0.5s, transform 0.8s var(--ios-pop) 0.5s;
        }
        .full-bottle-wrap.coming-soon.locked .coming-soon-badge {
            opacity: 1; transform: translate(-50%, -50%) scale(1);
        }
        .type-pill.locked-pill { opacity: 0.75; }

        .choice-banner { text-align: center; margin: 18px 0 6px 0; min-height: 34px; }

        /* Form fields */
        .order-field { margin-bottom: 16px; }
        .order-field label { display: block; font-size: 0.9rem; color: #bbb; margin-bottom: 7px; }
        .order-field input[type="text"], .order-field input[type="tel"], .order-field textarea {
            width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
            border-radius: 12px; padding: 13px 14px; color: #fff; font-family: 'Cairo', sans-serif; font-size: 1rem;
            outline: none; transition: border-color 0.3s, box-shadow 0.3s;
        }
        .order-field input:focus, .order-field textarea:focus {
            border-color: var(--gold); box-shadow: 0 0 0 3px rgba(220,167,74,0.18);
        }
        .order-field textarea { resize: vertical; min-height: 80px; }

        /* Searchable combobox */
        .combo-wrap { position: relative; }
        .combo-wrap input[disabled] { opacity: 0.45; cursor: not-allowed; }
        /* "Blacked out" state — baladiya field when office/Stop-Desk delivery is chosen (not required) */
        .field-blacked-out input {
            background: #000 !important; color: #555 !important;
            border-color: #1a1a1a !important; opacity: 1 !important;
            text-align: center; font-size: 0.85rem;
        }
        .field-blacked-out label { color: #555; }
        .combo-list {
            position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 260px; overflow-y: auto;
            background: #17130c; border: 1px solid rgba(220,167,74,0.4); border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7); z-index: 50; display: none;
            -webkit-overflow-scrolling: touch;
        }
        .combo-list.open { display: block; animation: fadeIn 0.25s var(--ios-ease); }
        .combo-item { padding: 11px 14px; color: #ddd; cursor: pointer; font-size: 0.95rem; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .combo-item:last-child { border-bottom: none; }
        .combo-item:hover, .combo-item:active { background: rgba(220,167,74,0.18); color: #fff; }
        .combo-empty { padding: 14px; color: #777; text-align: center; font-size: 0.9rem; }

        .order-submit-btn {
            position: sticky; bottom: 0; width: 100%; margin-top: 10px;
            background: linear-gradient(135deg, var(--gold), #b3802e); color: #000; border: none;
            border-radius: 14px; padding: 16px; font-family: 'Cairo', sans-serif; font-size: 1.15rem; font-weight: 800;
            cursor: pointer; box-shadow: 0 10px 25px rgba(220,167,74,0.35);
        }
        .order-submit-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }

        .order-toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: #17130c; border: 1px solid var(--gold); color: #fff; padding: 14px 22px;
            border-radius: 14px; z-index: 3000; opacity: 0; pointer-events: none; font-size: 0.95rem;
            transition: all 0.4s var(--ios-ease); text-align: center; max-width: 90vw;
            backdrop-filter: blur(10px);
        }
        .order-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

        /* Note pyramid chip visuals */
        .notes-chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
        .note-chip {
            display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(220,167,74,0.3); border-radius: 20px; padding: 5px 11px 5px 7px;
            font-size: 0.82rem; color: #eee;
        }
        .note-chip .chip-icon-wrap {
            width: 20px; height: 20px; border-radius: 50%; background: rgba(220,167,74,0.15);
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .note-chip .chip-icon-wrap svg { width: 11px; height: 11px; fill: var(--gold); }

        @media (max-width: 480px) {
            #order-overlay { width: 94vw; height: 88vh; }
            .order-header-title h3 { font-size: 1.25rem; }
            .sizes-row { gap: 10px; }
            .full-bottle-wrap img { height: 190px; }
            .order-scroll { padding: 16px 12px 20px 12px; }
        }
        @media (max-width: 340px) {
            .sizes-row { gap: 6px; }
        }

        /* ============ CART FAB + FLY ANIMATION + DRAWER ============ */
        #cart-fab {
            position: fixed; top: 16px; left: 16px; z-index: 150;
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(10,8,5,0.85); border: 1px solid rgba(220,167,74,0.55);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 6px 18px rgba(0,0,0,0.5);
            opacity: 0; transform: scale(0.7); transition: opacity 0.7s var(--ios-ease), transform 0.6s var(--ios-pop), z-index 0s;
            padding-top: env(safe-area-inset-top);
        }
        #cart-fab.visible { opacity: 1; transform: scale(1); }
        /* While something is flying toward it, the FAB must render above any open
           modal/overlay — otherwise the item appears to vanish behind the popup
           instead of landing in a visible cart icon. */
        #cart-fab.receiving { z-index: 3200; }
        #cart-fab svg { width: 22px; height: 22px; fill: var(--gold); position: relative; z-index: 2; transition: transform 0.6s var(--ios-pop); }
        #cart-fab.bump svg { animation: cartIconPop 0.9s var(--ios-pop); }
        #cart-fab.bump { animation: cartBump 0.9s var(--ios-pop); }
        @keyframes cartBump {
            0%   { transform: scale(1); }
            30%  { transform: scale(1.32); }
            55%  { transform: scale(0.94); }
            75%  { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        @keyframes cartIconPop {
            0%   { transform: rotate(0deg) scale(1); }
            25%  { transform: rotate(-10deg) scale(1.15); }
            55%  { transform: rotate(8deg) scale(1.05); }
            100% { transform: rotate(0deg) scale(1); }
        }
        /* Expanding ring burst that plays on landing, guiding the eye to the FAB */
        .cart-fab-ring {
            position: absolute; inset: -1px; border-radius: 50%;
            border: 2px solid var(--gold); opacity: 0; pointer-events: none;
        }
        #cart-fab.bump .cart-fab-ring { animation: cartRingBurst 0.9s var(--ios-ease-soft); }
        @keyframes cartRingBurst {
            0%   { transform: scale(0.7); opacity: 0.9; }
            100% { transform: scale(2.4); opacity: 0; }
        }
        .cart-badge {
            position: absolute; top: -4px; right: -4px; min-width: 19px; height: 19px; border-radius: 10px;
            background: var(--gold); color: #000; font-size: 0.68rem; font-weight: 800;
            display: flex; align-items: center; justify-content: center; padding: 0 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5); transform: scale(0); transition: transform 0.45s var(--ios-pop);
            z-index: 3;
        }
        .cart-badge.show { transform: scale(1); }
        .cart-badge.bump-badge { animation: badgePop 0.6s var(--ios-pop); }
        @keyframes badgePop { 0% { transform: scale(1); } 45% { transform: scale(1.45); } 100% { transform: scale(1); } }

        .fly-to-cart {
            position: fixed; z-index: 3100; pointer-events: none;
            --dx: 0px; --dy: 0px; --arc: -80px;
            display: flex; flex-direction: column; align-items: center;
        }
        .fly-to-cart.flying {
            animation: flyToCartArc 1.35s cubic-bezier(0.4, 0, 0.15, 1) forwards;
        }
        @keyframes flyToCartArc {
            0%   { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
            18%  { transform: translate(calc(var(--dx) * 0.06), calc(var(--dy) * 0.02 + var(--arc) * 0.12)) scale(1.08) rotate(-4deg); opacity: 1; }
            55%  { transform: translate(calc(var(--dx) * 0.58), calc(var(--dy) * 0.34 + var(--arc))) scale(0.68) rotate(10deg); opacity: 1; }
            85%  { transform: translate(calc(var(--dx) * 0.92), calc(var(--dy) * 0.85)) scale(0.32) rotate(18deg); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.08) rotate(24deg); opacity: 0; }
        }
        .fly-to-cart img, .fly-to-cart svg {
            width: 46px; height: 46px; object-fit: contain; border-radius: 10px;
            filter: drop-shadow(0 8px 14px rgba(0,0,0,0.65)) drop-shadow(0 0 16px rgba(220,167,74,0.5));
        }
        /* Soft glowing trail dot that fades slightly behind the flying item,
           reinforcing the sense of motion toward the cart. */
        .fly-to-cart::after {
            content: ''; position: absolute; top: 50%; left: 50%; width: 46px; height: 46px;
            transform: translate(-50%, -50%); border-radius: 50%;
            background: radial-gradient(circle, rgba(220,167,74,0.35) 0%, transparent 70%);
            filter: blur(4px); z-index: -1;
        }
        .fly-to-cart-label {
            margin-top: 6px; font-family: 'Cairo', sans-serif; font-weight: 800; font-size: 0.95rem;
            color: var(--gold); text-shadow: 0 2px 6px rgba(0,0,0,0.8);
            opacity: 0; animation: flyLabelFade 1.35s ease forwards;
        }
        @keyframes flyLabelFade {
            0%   { opacity: 0; transform: translateY(4px); }
            15%  { opacity: 1; transform: translateY(0); }
            70%  { opacity: 1; }
            100% { opacity: 0; transform: translateY(-6px); }
        }

        #cart-drawer-backdrop {
            position: fixed; inset: 0; z-index: 2199; background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
        }
        #cart-drawer-backdrop.active { opacity: 1; pointer-events: all; }
        #cart-drawer {
            position: fixed; z-index: 2200; top: 50%; left: 50%;
            width: min(90vw, 400px); max-height: 74vh;
            background: linear-gradient(180deg, #1a150e 0%, #050402 100%);
            border: 1px solid rgba(220,167,74,0.6); border-radius: 20px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.95);
            transform: translate(-50%, -50%) scale(0.9); opacity: 0;
            transition: transform 0.6s var(--ios-pop), opacity 0.42s ease-out;
            display: none; flex-direction: column; overflow: hidden;
        }
        #cart-drawer.active { display: flex; opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .cart-drawer-header { display: flex; align-items: center; justify-content: space-between; padding: 18px 18px 12px 18px; border-bottom: 1px solid rgba(220,167,74,0.25); }
        .cart-drawer-header h3 { font-family: 'NASKHFONT', serif; font-size: 1.4rem; color: #fff; }
        .cart-drawer-list { flex: 1; overflow-y: auto; padding: 10px 16px; }
        .cart-drawer-item { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .cart-drawer-item img { width: 46px; height: 46px; object-fit: contain; background: rgba(255,255,255,0.05); border-radius: 8px; padding: 4px; flex-shrink: 0; }
        .cart-drawer-item-info { flex: 1; min-width: 0; }
        .cart-drawer-item-name { font-size: 0.92rem; color: #eee; margin-bottom: 8px; }
        .cart-drawer-item-qty { font-size: 0.85rem; color: var(--gold); font-weight: 700; }
        .cart-size-chip-row { display: flex; gap: 6px; }
        .cart-size-chip {
            font-size: 0.78rem; color: #ccc; padding: 4px 10px; border-radius: 20px; cursor: pointer;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15);
        }
        .cart-size-chip.selected { color: #000; background: var(--gold); border-color: var(--gold); font-weight: 700; }
        .cart-drawer-item-remove { color: #888; cursor: pointer; font-size: 1.2rem; padding: 4px 8px; flex-shrink: 0; }
        .cart-drawer-empty { text-align: center; color: #888; padding: 30px 10px; }
        .cart-drawer-footer { padding: 14px 18px; border-top: 1px solid rgba(220,167,74,0.25); }
        .cart-drawer-footer .order-submit-btn { position: static; margin-top: 0; }
        .cart-drawer-footer-price { text-align: center; margin-bottom: 10px; font-size: 0.95rem; color: #ccc; }
        .cart-drawer-footer-price .glow-sweep-text { font-size: 1.15rem; }
        .cart-drawer-footer-price .price-strike { display: inline-block; text-decoration: line-through; color: #888; font-size: 0.8rem; margin-left: 6px; }
        .cart-drawer-footer-price .coupon-badge { display: block; font-size: 0.72rem; color: #4cd964; margin-top: 3px; }

        /* Cart contents summary shown at the top of the cart checkout form */
        .cart-order-items { display: flex; flex-direction: column; gap: 10px; }
        .cart-order-item-row {
            display: flex; align-items: center; gap: 12px; padding: 10px 12px;
            background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px;
        }
        .cart-order-item-row img { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
        .cart-order-item-text { font-size: 0.92rem; color: #eee; flex: 1; }
        .cart-order-item-qty { color: var(--gold); font-weight: 700; }

        /* ============ iOS-STYLE CONFIRMATION ALERT ============ */
        #ios-alert-backdrop {
            position: fixed; inset: 0; z-index: 3100; background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
        }
        #ios-alert-backdrop.active { opacity: 1; pointer-events: all; }
        #ios-alert {
            position: fixed; z-index: 3101; top: 50%; left: 50%;
            width: min(84vw, 300px);
            background: rgba(28, 24, 16, 0.88);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(220,167,74,0.35);
            border-radius: 18px; text-align: center; overflow: hidden;
            transform: translate(-50%, -50%) scale(0.7); opacity: 0;
            transition: transform 0.55s var(--ios-pop), opacity 0.4s ease-out;
            display: none;

            if (test(["حمض","برغموت","ليمون","برتقال","يوسفي","جريب فروت","ليم"])) return icons.citrus;
            if (test(["أناناس","تفاح","كشمش","فاكه","فواكه","فراولة"])) return icons.fruit;
            if (test(["زهر","ياسمين","لافندر","خزامى","زيزفون","رقيب الشمس","ورد"])) return icons.flower;
            if (test(["فلفل","هيل","كراوية","توابل","قرنفل","زنجبيل"])) return icons.spice;
            if (test(["ريحان","نجيل","أوراق","طحلب","عشب"])) return icons.leaf;
            if (test(["مسك","عنبر","أمبروكسان","فانيليا","جلد"])) return icons.musk;
            if (test(["خشب","صندل","أرز","باتشولي","أوكيجالاوود","أكيجالاوود"])) return icons.wood;

        // Numeric delivery price for the currently selected wilaya + delivery
        // type, or null if unavailable (no wilaya/type picked yet, or this
        // wilaya has no delivery coverage at all).
        function getDeliveryPriceValue() {
            if (!orderState.wilaya || !orderState.deliveryType) return null;
            const entry = WILAYA_DELIVERY_PRICES[orderState.wilaya.code];
            if (!entry) return null;
            const val = orderState.deliveryType === 'home' ? entry.home : entry.office;
            return typeof val === 'number' ? val : null;
        }

        // Returns the HTML to show under the delivery-type step, based on the
        // currently selected wilaya + delivery type.
        function getDeliveryPriceHtml() {
            if (!orderState.wilaya || !orderState.deliveryType) return '';
            const entry = WILAYA_DELIVERY_PRICES[orderState.wilaya.code];
            if (!entry) {
                return `<div class="delivery-price-note delivery-price-note--pending">🚫 التوصيل غير متوفر حالياً لهذه الولاية — تواصل معنا عبر فيسبوك أو تيك توك</div>`;
            }
            const val = orderState.deliveryType === 'home' ? entry.home : entry.office;
            if (typeof val === 'number') {
                return `<div class="delivery-price-note">🚚 سعر التوصيل: <span class="glow-sweep-text">${numFont(val + ' دج')}</span></div>`;
            }
            return `<div class="delivery-price-note delivery-price-note--pending">🚚 سيتم إعلامك بسعر التوصيل عند تأكيد الطلب هاتفياً</div>`;
        }

        function updateDeliveryPriceNote() {
            const el = document.getElementById('delivery-price-note');
            if (el) el.innerHTML = getDeliveryPriceHtml();
        }

        // Plain-text version (no HTML) used in the payload sent to the backend/Telegram.
        function getDeliveryPriceLabel() {
            const val = getDeliveryPriceValue();
            if (typeof val === 'number') return `${val} دج`;
            if (!orderState.wilaya || !orderState.deliveryType) return null;
            return WILAYA_DELIVERY_PRICES[orderState.wilaya.code] ? 'سيُحدد هاتفياً عند تأكيد الطلب' : 'لا تتوفر تغطية توصيل لهذه الولاية';

        // Shown once per page load, the very first time the customer taps
        // "إتمام الطلب" on any perfume — never again after that until reload.
        let couponPopupShown = false;
        function maybeShowCouponPopup() {

            showIosAlert({

            });

        function bottleShapeSVG(ml) {
            // Simple, elegant spray-bottle SHAPES (not photos) inspired by the reference
            // image: clear square-ish glass body, metallic cap + spray pump.
            // Bigger ml => taller/wider silhouette. Sizes are generous — the visual is
            // deliberately cropped (top portion only) with a soft fade by its container.
            const dims = {
                10: { w: 92, h: 260, bodyTop: 104 },
                20: { w: 104, h: 300, bodyTop: 110 },
                30: { w: 116, h: 340, bodyTop: 116 }
            }[ml];
            const { w, h, bodyTop } = dims;
            const cx = w / 2;
            return `
            <svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <linearGradient id="capGrad${ml}" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#8a6a2c"/>
                        <stop offset="50%" stop-color="#f0d38a"/>
                        <stop offset="100%" stop-color="#8a6a2c"/>
                    </linearGradient>
                    <linearGradient id="glassGrad${ml}" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="rgba(255,255,255,0.05)"/>
                        <stop offset="45%" stop-color="rgba(255,255,255,0.35)"/>
                        <stop offset="55%" stop-color="rgba(255,255,255,0.35)"/>
                        <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
                    </linearGradient>
                </defs>
                <!-- nozzle button -->
                <circle cx="${cx}" cy="12" r="9" fill="#e9e9e9"/>
                <!-- pump stem -->
                <rect x="${cx-4.5}" y="21" width="9" height="14" fill="#ccc"/>
                <!-- cap -->
                <rect x="${cx-19}" y="35" width="38" height="48" rx="6" fill="url(#capGrad${ml})" stroke="#5c451c" stroke-width="1.4"/>
                <!-- neck -->
                <rect x="${cx-9}" y="${bodyTop-20}" width="18" height="26" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.4)" stroke-width="0.8"/>
                <!-- body -->
                <rect x="8" y="${bodyTop}" width="${w-16}" height="${h-bodyTop-10}" rx="14"
                      fill="rgba(255,255,255,0.08)" stroke="rgba(220,167,74,0.55)" stroke-width="1.8"/>
                <rect x="8" y="${bodyTop}" width="${w-16}" height="${h-bodyTop-10}" rx="14" fill="url(#glassGrad${ml})"/>
                <!-- base shadow ellipse -->
                <ellipse cx="${cx}" cy="${h-8}" rx="${(w-16)/2}" ry="5" fill="rgba(0,0,0,0.35)"/>
            </svg>`;
        }

        window.closeOrder = function() {
            const overlay = document.getElementById('order-overlay');
            const backdrop2 = document.getElementById('order-overlay-backdrop-blur');
            overlay.classList.remove('active');
            backdrop2.classList.remove('active');
            document.removeEventListener('click', comboOutsideClick);
            setTimeout(() => {
                overlay.style.display = 'none';
                document.body.classList.remove('no-scroll');
            }, 650);
        };

        function comboOutsideClick(e) {
            if (!e.target.closest('.combo-wrap')) {
                document.querySelectorAll('.combo-list').forEach(l => l.classList.remove('open'));
            }
        }

        function renderPurchaseVisual(p) {
            document.getElementById('pill-decant').classList.toggle('selected', orderState.purchaseType === 'decant');
            document.getElementById('pill-full').classList.toggle('selected', orderState.purchaseType === 'full');
            if (orderState.purchaseType === 'full') document.getElementById('pill-full').classList.remove('locked-pill');
            const area = document.getElementById('purchase-visual-area');

            if (orderState.purchaseType === 'decant') {
                area.innerHTML = `
                    <div class="sizes-instruction"><span class="arrow-bounce">👇</span> اضغط على الحجم الذي تريده</div>
                    <div class="sizes-row">
                        ${[10, 20, 30].map(ml => `
                            <div class="size-bottle-card" id="size-card-${ml}" onclick="selectSize(${ml})">
                                <div class="bottle-visual-crop">${bottleShapeSVG(ml)}</div>
                                <div class="size-label-badge">${ml} مل</div>
                                <div class="size-price">${p.price['p' + ml]}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            } else if (orderState.purchaseType === 'full') {
                area.innerHTML = `
                    <div class="full-bottle-wrap" id="full-bottle-wrap">
                        <div class="full-bottle-badge">✨ خيار خاص</div>
                        <div class="full-bottle-shine-wrap" id="full-bottle-shine-wrap">
                            <div class="full-bottle-floater">
                                <img id="full-bottle-img" src="${p.imgC}" onerror="this.onerror=null;this.src='fallback.webp'">
                            </div>
                            <div class="coming-soon-badge">سيتوفر قريباً ✨</div>
                        </div>
                        <div class="full-bottle-price">${p.price.full}</div>
                    </div>
                `;
                orderState.size = null;

                // Let the user admire it for a beat with a light sweeping across the
                // glass, then it settles into a dimmed, blurred "coming soon" state —
                // this option genuinely isn't purchasable yet.
                const wrap = document.getElementById('full-bottle-wrap');
                const shineWrap = document.getElementById('full-bottle-shine-wrap');
                requestAnimationFrame(() => {
                    wrap.classList.add('coming-soon');
                    shineWrap.classList.add('shine');
                });
                clearTimeout(window._fullBottleLockTimer);
                window._fullBottleLockTimer = setTimeout(() => {
                    if (!document.getElementById('full-bottle-wrap')) return;
                    wrap.classList.add('locked');
                    // This option can't actually be completed right now — release the
                    // selection so the order form correctly asks for a real choice.
                    if (orderState.purchaseType === 'full') {
                        orderState.purchaseType = null;
                        document.getElementById('pill-full').classList.remove('selected');
                        document.getElementById('pill-full').classList.add('locked-pill');
