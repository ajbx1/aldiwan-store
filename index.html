                    }
                }, 1400);
            } else {
                area.innerHTML = '';
            }
            updateChoiceBanner();
        }

        window.selectPurchaseType = function(type) {
            orderState.purchaseType = type;
            orderState.size = null;
            const p = perfumesData.find(x => x.id === orderState.perfumeId);
            renderPurchaseVisual(p);
        };

        window.selectDeliveryType = function(type) {
            orderState.deliveryType = type;
            const homePill = document.getElementById('pill-deliver-home');
            const officePill = document.getElementById('pill-deliver-office');
            if (homePill) homePill.classList.toggle('selected', type === 'home');
            if (officePill) officePill.classList.toggle('selected', type === 'office');

            // Office (Stop Desk) delivery doesn't need a specific baladiya —
            // black the field out and stop requiring it.
            const baladiyaInput = document.getElementById('ord-baladiya-input');
            const baladiyaField = baladiyaInput ? baladiyaInput.closest('.order-field') : null;
            if (baladiyaInput) {
                if (type === 'office') {
                    orderState.baladiya = 'توصيل للمكتب';
                    baladiyaInput.value = 'غير مطلوب (توصيل للمكتب)';
                    baladiyaInput.disabled = true;
                    if (baladiyaField) baladiyaField.classList.add('field-blacked-out');
                    document.getElementById('baladiya-list')?.classList.remove('open');
                } else {
                    orderState.baladiya = null;
                    baladiyaInput.disabled = !orderState.wilaya;
                    baladiyaInput.placeholder = orderState.wilaya ? 'اكتب أو اختر البلدية...' : 'اختر الولاية أولاً';
                    if (baladiyaInput.value === 'غير مطلوب (توصيل للمكتب)') baladiyaInput.value = '';
                    if (baladiyaField) baladiyaField.classList.remove('field-blacked-out');
                }
            }

            updateDeliveryPriceNote();
            updateOrderFooterPrice();
        };

        window.selectSize = function(ml) {
            orderState.size = ml;
            document.querySelectorAll('.size-bottle-card').forEach(el => el.classList.remove('selected'));
            const chosen = document.getElementById(`size-card-${ml}`);
            if (chosen) chosen.classList.add('selected');
            updateChoiceBanner();
        };

        function updateChoiceBanner() {
            const banner = document.getElementById('choice-banner');
            if (banner) {
                if (orderState.purchaseType === 'decant' && orderState.size) {
                    banner.innerHTML = `<span class="glow-sweep-text">✨ اخترت ${numFont(orderState.size)} مل ✨</span>`;
                } else if (orderState.purchaseType === 'full') {
                    banner.innerHTML = `<span class="glow-sweep-text">✨ اخترت العبوة الكاملة ✨</span>`;
                } else {
                    banner.innerHTML = '';
                }
            }
            updateOrderFooterPrice();
        }

        // Price shown beside "تأكيد الطلب" — appears once the user has actually
        // picked a size (or the full bottle), reflecting exactly what they chose,
        // plus the delivery price once wilaya + delivery type are both set.
        // When there's no active single-perfume order (i.e. we're in the cart
        // checkout flow), this delegates to the cart's own price summary.
        function updateOrderFooterPrice() {
            const el = document.getElementById('order-footer-price');
            if (!el) return;

            if (orderState.perfumeId === null) {
                el.innerHTML = cartState.items.length ? cartPriceHtml(true) : '';
                return;
            }

            const p = perfumesData.find(x => x.id === orderState.perfumeId);
            if (!p) { el.innerHTML = ''; return; }

            let price = null;
            if (orderState.purchaseType === 'decant' && orderState.size) {
                price = p.price['p' + orderState.size];
            } else if (orderState.purchaseType === 'full') {
                price = p.price.full;
            }

            if (price === null || price === undefined) { el.innerHTML = ''; return; }

            if (typeof price !== 'number') {
                el.innerHTML = `<span class="glow-sweep-text">${numFont(price)}</span>`;
                return;
            }

            const deliveryPrice = getDeliveryPriceValue();
            const grandTotal = deliveryPrice !== null ? price + deliveryPrice : price;
            let html = `<span class="glow-sweep-text">${numFont(grandTotal + ' دج')}</span>`;
            if (deliveryPrice !== null) {
                html += `<span class="price-breakdown">(${numFont(price)} + ${numFont(deliveryPrice)} توصيل)</span>`;
            }
            el.innerHTML = html;
        }

        // ---- Searchable Wilaya combobox ----
        window.filterWilaya = function(query) {
            const list = document.getElementById('wilaya-list');
            const q = (query || '').trim();
            const matches = WILAYAS_DATA.filter(w => !q || w.name.includes(q) || w.code.includes(q));
            list.innerHTML = matches.length
                ? matches.map(w => `<div class="combo-item" onclick="pickWilaya('${w.code}')">${w.name}</div>`).join('')
                : `<div class="combo-empty">لا توجد نتائج</div>`;
            list.classList.add('open');
        };

        window.pickWilaya = function(code) {
            const w = WILAYAS_DATA.find(x => x.code === code);
            orderState.wilaya = w;
            document.getElementById('ord-wilaya-input').value = w.name;
            document.getElementById('wilaya-list').classList.remove('open');

            const baladiyaInput = document.getElementById('ord-baladiya-input');
            const baladiyaField = baladiyaInput ? baladiyaInput.closest('.order-field') : null;
            if (orderState.deliveryType === 'office') {
                // Baladiya stays blacked-out/not required for office (stop desk) delivery.
                orderState.baladiya = 'توصيل للمكتب';
            } else {
                orderState.baladiya = null;
                baladiyaInput.disabled = false;
                baladiyaInput.value = '';
                baladiyaInput.placeholder = 'اكتب أو اختر البلدية...';
                if (baladiyaField) baladiyaField.classList.remove('field-blacked-out');
            }

            updateDeliveryPriceNote();
            updateOrderFooterPrice();

            if (!WILAYA_DELIVERY_PRICES[w.code]) {
                showNoDeliveryPopup(w.name);
            }
        };

        // ---- Searchable Baladiya combobox (depends on selected wilaya) ----
        window.filterBaladiya = function(query) {
            if (!orderState.wilaya) return;
            const list = document.getElementById('baladiya-list');
            const q = (query || '').trim();
            const communes = orderState.wilaya.communes.filter(c => !q || c.includes(q));
            list.innerHTML = communes.length
                ? communes.map(c => `<div class="combo-item" onclick="pickBaladiya('${c.replace(/'/g, "\\'")}')">${c}</div>`).join('')
                : `<div class="combo-empty">لا توجد نتائج</div>`;
            list.classList.add('open');
        };

        window.pickBaladiya = function(name) {
            orderState.baladiya = name;
            document.getElementById('ord-baladiya-input').value = name;
            document.getElementById('baladiya-list').classList.remove('open');
        };

        function showOrderToast(msg) {
            const toast = document.getElementById('order-toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 3200);
        }

        window.submitOrder = function() {
            const p = perfumesData.find(x => x.id === orderState.perfumeId);
            const name = document.getElementById('ord-name').value.trim();
            const phone = document.getElementById('ord-phone').value.trim();
            const notes = document.getElementById('ord-notes').value.trim();

            if (!orderState.purchaseType) { showOrderToast('يرجى اختيار طريقة الشراء أولاً'); return; }
            if (orderState.purchaseType === 'decant' && !orderState.size) { showOrderToast('يرجى اختيار حجم العبوة (10/20/30 مل)'); return; }
            if (!orderState.deliveryType) { showOrderToast('يرجى اختيار طريقة التوصيل (منزل/مكتب)'); return; }
            if (!name) { showOrderToast('يرجى إدخال الاسم الكامل'); return; }
            if (!phone) { showOrderToast('يرجى إدخال رقم الهاتف'); return; }
            if (!orderState.wilaya) { showOrderToast('يرجى اختيار الولاية'); return; }
            if (!orderState.baladiya) { showOrderToast('يرجى اختيار البلدية'); return; }
            if (!WILAYA_DELIVERY_PRICES[orderState.wilaya.code]) {
                showNoDeliveryPopup(orderState.wilaya.name);
                return;
            }

            const sizeLabel = orderState.purchaseType === 'decant' ? `${orderState.size} مل (تقسيم)` : 'العبوة الكاملة';
            const price = orderState.purchaseType === 'decant' ? p.price['p' + orderState.size] : p.price.full;
            const deliveryLabel = orderState.deliveryType === 'home' ? 'توصيل للمنزل' : 'توصيل للمكتب';
            const deliveryPrice = getDeliveryPriceValue();
            const total = (typeof price === 'number' && deliveryPrice !== null) ? price + deliveryPrice : price;

            const submitBtn = document.querySelector('#order-overlay .order-submit-btn');
            sendOrderToBackend({
                items: [{ name: p.clone, alt_of: p.orig, type: sizeLabel, price }],
                deliveryType: deliveryLabel,
                deliveryPrice: getDeliveryPriceLabel(),
                total,
                name, phone,
                wilaya: orderState.wilaya.name,
                baladiya: orderState.baladiya,
                notes: notes || null
            }, submitBtn, () => {
                showIosAlert({
                    title: 'تم استلام طلبك بنجاح ✅',
                    msg: 'وصلنا طلبك، وسيتواصل معك فريقنا قريباً لتأكيد التفاصيل وموعد التوصيل.',
                    btnText: 'حسناً',
                    onClose: () => closeOrder()
                });
            });
        };

        // =====================================================================
        // BACKEND HANDOFF — sends the order to the free Google Apps Script
        // endpoint described in SETUP-GUIDE.md (it notifies Telegram + logs to
        // a Google Sheet on your end). Paste the deployed Web App URL below.
        // =====================================================================
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwJcR552yo7HyLBMvSquESG-1pD2e3IuOz5fDz7cw9Glopm8FjKFzhQOQhDT4kwQNQ/exec";

        function sendOrderToBackend(payload, submitBtn, onDone) {
            if (submitBtn) { submitBtn.disabled = true; submitBtn.textContent = 'جارِ الإرسال...'; }

            const finish = () => {
                if (submitBtn) { submitBtn.disabled = false; submitBtn.textContent = 'تأكيد الطلب'; }
                onDone();
            };

            if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.includes('PASTE_YOUR')) {
                // Backend not linked yet — proceed with the confirmation UI so the
                // flow can still be tested end-to-end while it's being wired up.
                setTimeout(finish, 500);
                return;
            }

            fetch(APPS_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // Apps Script web apps don't return CORS headers
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            }).then(finish).catch(finish);
        }

        // =====================================================================
        // CART — add-to-cart flourish + persistent cart button + simple drawer
        // =====================================================================
        const cartState = { items: [] }; // {id, name, img, qty}

        function updateCartBadge() {
            const totalQty = cartState.items.reduce((s, it) => s + it.qty, 0);
            const badge = document.getElementById('cart-badge');
            badge.textContent = totalQty;
            badge.classList.toggle('show', totalQty > 0);
        }

        window.addToCart = function(perfumeId, evt) {
            const p = perfumesData.find(x => x.id === perfumeId);
            const btn = evt.currentTarget;
            const btnRect = btn.getBoundingClientRect();
            const cartFab = document.getElementById('cart-fab');

            // Bring the FAB above any open modal/backdrop for the whole flight so the
            // item visibly lands INTO a cart icon the user can actually see, instead
            // of disappearing behind the popup mid-flight.
            cartFab.classList.add('receiving');
            const cartRect = cartFab.getBoundingClientRect();

            const dx = (cartRect.left + cartRect.width / 2) - (btnRect.left + btnRect.width / 2);
            const dy = (cartRect.top + cartRect.height / 2) - (btnRect.top + btnRect.height / 2);
            // A gentle upward bow so the flight arcs like a toss, not a straight line
            const arc = -Math.max(70, Math.abs(dy) * 0.5);

            // Flying clone: little bottle image arcs from the button to the cart icon,
            // with a "+1" label riding alongside so it's obvious where the product went.
            const flyer = document.createElement('div');
            flyer.className = 'fly-to-cart';
            flyer.innerHTML = `<img src="${p.imgC}" onerror="this.onerror=null;this.src='fallback.webp'"><span class="fly-to-cart-label">+1</span>`;
            flyer.style.top = `${btnRect.top + btnRect.height / 2 - 23}px`;
            flyer.style.left = `${btnRect.left + btnRect.width / 2 - 23}px`;
            flyer.style.setProperty('--dx', `${dx}px`);
            flyer.style.setProperty('--dy', `${dy}px`);
            flyer.style.setProperty('--arc', `${arc}px`);
            document.body.appendChild(flyer);

            // A brief "lift off" pulse on the source button so the eye knows exactly
            // where the item started before it takes flight.
            btn.style.transition = 'transform 0.25s var(--ios-pop)';
            btn.style.transform = 'scale(0.88)';
            setTimeout(() => { btn.style.transform = 'scale(1)'; }, 220);

            requestAnimationFrame(() => flyer.classList.add('flying'));

            setTimeout(() => {
                flyer.remove();
                cartFab.classList.add('bump');
                const badge = document.getElementById('cart-badge');
                badge.classList.add('bump-badge');
                setTimeout(() => {
                    cartFab.classList.remove('bump');
                    cartFab.classList.remove('receiving');
                    badge.classList.remove('bump-badge');
                }, 900);

                const existing = cartState.items.find(it => it.id === perfumeId);
                if (existing) existing.qty += 1;
                else cartState.items.push({ id: perfumeId, name: p.clone, img: p.imgC, qty: 1, size: 10 });
                updateCartBadge();
                showOrderToast(`أُضيف ${p.clone} إلى سلتك ✨`);
            }, 1330);
        };

        window.toggleCartDrawer = function() {
            const drawer = document.getElementById('cart-drawer');
            const backdrop3 = document.getElementById('cart-drawer-backdrop');
            const opening = !drawer.classList.contains('active');
            if (opening) {
                renderCartDrawer();
                drawer.style.display = 'flex';
                void drawer.offsetWidth;
                drawer.classList.add('active');
                backdrop3.classList.add('active');
            } else {
                drawer.classList.remove('active');
                backdrop3.classList.remove('active');
                setTimeout(() => { drawer.style.display = 'none'; }, 600);
            }
        };

        // Sums the cart at each item's chosen size, and applies the 10% coupon
        // once total quantity across the cart reaches 5 (any perfumes, any mix).
        function computeCartTotals() {
            let subtotal = 0;
            let qty = 0;
            cartState.items.forEach(it => {
                const p = perfumesData.find(x => x.id === it.id);
                const unit = p ? Number(p.price['p' + it.size]) || 0 : 0;
                subtotal += unit * it.qty;
                qty += it.qty;
            });
            const eligible = qty >= 5;
            const discount = eligible ? Math.round(subtotal * 0.10) : 0;
            const total = subtotal - discount;
            return { subtotal, discount, total, qty, eligible };
        }

        // Renders the price block used both in the cart drawer and the cart
        // checkout footer — plain total, or strikethrough + discounted total
        // plus a small badge once the 5-item coupon kicks in. Pass
        // includeDelivery=true (checkout footer, once wilaya + delivery type
        // are picked) to fold the delivery price into the grand total shown.
        function cartPriceHtml(includeDelivery) {
            const { subtotal, total, qty, eligible } = computeCartTotals();
            const deliveryPrice = includeDelivery ? getDeliveryPriceValue() : null;
            const grandTotal = deliveryPrice !== null ? total + deliveryPrice : total;

            let html = '';
            if (eligible) {
                html += `<span class="price-strike">${subtotal} دج</span>`;
            }
            html += `<span class="glow-sweep-text">${numFont(grandTotal)} دج</span>`;
            if (eligible) {
                html += `<span class="coupon-badge">🎉 خصم 10% مطبق (${qty} قطع)</span>`;
            }
            if (deliveryPrice !== null) {
                html += `<span class="price-breakdown">(يشمل ${numFont(deliveryPrice)} دج توصيل)</span>`;
            }
            return html;
        }

        function renderCartDrawer() {
            const drawer = document.getElementById('cart-drawer');
            if (!cartState.items.length) {
                drawer.innerHTML = `
                    <div class="cart-drawer-header"><h3>سلتك</h3><span style="color:#888;cursor:pointer;font-size:1.3rem" onclick="toggleCartDrawer()">&times;</span></div>
                    <div class="cart-drawer-empty">السلة فارغة حالياً 🌸<br><small>أضف عطراً من الصفحة لتراه هنا</small></div>
                `;
                return;
            }
            drawer.innerHTML = `
                <div class="cart-drawer-header"><h3>سلتك (${cartState.items.reduce((s,i)=>s+i.qty,0)})</h3><span style="color:#888;cursor:pointer;font-size:1.3rem" onclick="toggleCartDrawer()">&times;</span></div>
                <div class="cart-drawer-list">
                    ${cartState.items.map(it => `
                        <div class="cart-drawer-item">
                            <img src="${it.img}" onerror="this.onerror=null;this.src='fallback.webp'">
                            <div class="cart-drawer-item-info">
                                <div class="cart-drawer-item-name">${it.name} <span class="cart-drawer-item-qty">×${it.qty}</span></div>
                                <div class="cart-size-chip-row">
                                    ${[10, 20, 30].map(ml => `
                                        <div class="cart-size-chip ${it.size === ml ? 'selected' : ''}" onclick="setCartItemSize(${it.id}, ${ml})">${ml} مل</div>
                                    `).join('')}
                                </div>
                            </div>
                            <div class="cart-drawer-item-remove" onclick="removeFromCart(${it.id})">&times;</div>
                        </div>
                    `).join('')}
                </div>
                <div class="cart-drawer-footer">
                    <div class="cart-drawer-footer-price">${cartPriceHtml(false)}</div>
                    <button class="order-submit-btn" onclick="openCartOrder()">إتمام الطلب</button>
                </div>
            `;
        }

        window.setCartItemSize = function(perfumeId, ml) {
            const it = cartState.items.find(x => x.id === perfumeId);
            if (it) it.size = ml;
            renderCartDrawer();
        };

        window.removeFromCart = function(perfumeId) {
            cartState.items = cartState.items.filter(it => it.id !== perfumeId);
            updateCartBadge();
            renderCartDrawer();
        };

        // =====================================================================
        // CART CHECKOUT — lets the user complete an order for everything in the
        // cart in one go, without having to reopen each perfume individually.
        // =====================================================================
        window.openCartOrder = function() {
            if (!cartState.items.length) { showOrderToast('السلة فارغة حالياً'); return; }
            maybeShowCouponPopup();

            // Jump straight from the drawer into the checkout sheet.
            const drawer = document.getElementById('cart-drawer');
            const drawerBackdrop = document.getElementById('cart-drawer-backdrop');
            drawer.classList.remove('active');
            drawerBackdrop.classList.remove('active');
            drawer.style.display = 'none';

            orderState.perfumeId = null;
            orderState.purchaseType = null;
            orderState.size = null;
            orderState.deliveryType = null;
            orderState.wilaya = null;
            orderState.baladiya = null;

            const totalQty = cartState.items.reduce((s, i) => s + i.qty, 0);
            const itemsHtml = cartState.items.map(it => `
                <div class="cart-order-item-row">
                    <img src="${it.img}" onerror="this.onerror=null;this.src='fallback.webp'">
                    <div class="cart-order-item-text">${it.name} — ${it.size} مل <span class="cart-order-item-qty">×${it.qty}</span></div>
                </div>
            `).join('');

            const overlay = document.getElementById('order-overlay');
            const backdrop2 = document.getElementById('order-overlay-backdrop-blur');

            overlay.innerHTML = `
                <div class="order-header">
                    <button class="btn-back-order" onclick="closeOrder()">&times;</button>
                    <div class="order-header-title">
                        <h3>إتمام الطلب</h3>
                        <small>طلبك يضم ${totalQty} ${totalQty === 1 ? 'قطعة' : 'قطع'}</small>
                    </div>
                </div>
                <div class="order-scroll">
                    <div class="order-section-label">1) محتويات السلة</div>
                    <div class="cart-order-items">${itemsHtml}</div>

                    <div class="order-section-label">2) طريقة التوصيل</div>
                    <div class="type-toggle-row">
                        <div class="type-pill" id="pill-deliver-home" onclick="selectDeliveryType('home')">🏠 توصيل للمنزل</div>
                        <div class="type-pill" id="pill-deliver-office" onclick="selectDeliveryType('office')">🏢 توصيل للمكتب</div>
                    </div>
                    <div class="delivery-price-note" id="delivery-price-note"></div>

                    <div class="order-section-label">3) معلومات التوصيل</div>
                    <div class="order-field">
                        <label>الاسم الكامل</label>
                        <input type="text" id="ord-name" placeholder="مثال: أحمد بن علي" autocomplete="off">
                    </div>
                    <div class="order-field">
                        <label>رقم الهاتف</label>
                        <input type="tel" id="ord-phone" placeholder="0555 12 34 56" autocomplete="off">
                    </div>
                    <div class="order-field combo-wrap">
                        <label>الولاية</label>
                        <input type="text" id="ord-wilaya-input" placeholder="اكتب أو اختر الولاية..." autocomplete="off"
                               oninput="filterWilaya(this.value)" onfocus="filterWilaya(this.value)">
                        <div class="combo-list" id="wilaya-list"></div>
                    </div>
                    <div class="order-field combo-wrap">
                        <label>البلدية</label>
                        <input type="text" id="ord-baladiya-input" placeholder="اختر الولاية أولاً" autocomplete="off" disabled
                               oninput="filterBaladiya(this.value)" onfocus="filterBaladiya(this.value)">
                        <div class="combo-list" id="baladiya-list"></div>
                    </div>
                    <div class="order-field">
                        <label>عنوان بالتفصيل / ملاحظات (اختياري)</label>
                        <textarea id="ord-notes" placeholder="الحي، رقم المنزل، أقرب نقطة معروفة..."></textarea>
                    </div>
                </div>
                <div class="order-footer">
                    <div class="order-footer-price" id="order-footer-price"></div>
                    <button class="order-submit-btn" onclick="submitCartOrder()">تأكيد الطلب</button>
                </div>
            `;

            overlay.style.display = 'flex';
            backdrop2.classList.add('active');
            document.body.classList.add('no-scroll');
            void overlay.offsetWidth;
            overlay.classList.add('active');

            updateOrderFooterPrice();
            document.addEventListener('click', comboOutsideClick);
        };

        window.submitCartOrder = function() {
            const name = document.getElementById('ord-name').value.trim();
            const phone = document.getElementById('ord-phone').value.trim();
            const notes = document.getElementById('ord-notes').value.trim();

            if (!orderState.deliveryType) { showOrderToast('يرجى اختيار طريقة التوصيل (منزل/مكتب)'); return; }
            if (!name) { showOrderToast('يرجى إدخال الاسم الكامل'); return; }
            if (!phone) { showOrderToast('يرجى إدخال رقم الهاتف'); return; }
            if (!orderState.wilaya) { showOrderToast('يرجى اختيار الولاية'); return; }
            if (!orderState.baladiya) { showOrderToast('يرجى اختيار البلدية'); return; }
            if (!WILAYA_DELIVERY_PRICES[orderState.wilaya.code]) {
                showNoDeliveryPopup(orderState.wilaya.name);
                return;
            }

            const deliveryLabel = orderState.deliveryType === 'home' ? 'توصيل للمنزل' : 'توصيل للمكتب';
            const items = cartState.items.map(it => {
                const p = perfumesData.find(x => x.id === it.id);
                return { name: it.name, alt_of: p ? p.orig : '', type: `${it.size} مل (تقسيم)`, qty: it.qty, price: p ? p.price['p' + it.size] : '???' };
            });
            const totals = computeCartTotals();
            const deliveryPrice = getDeliveryPriceValue();
            const grandTotal = deliveryPrice !== null ? totals.total + deliveryPrice : totals.total;

            const submitBtn = document.querySelector('#order-overlay .order-submit-btn');
            sendOrderToBackend({
                items,
                subtotal: totals.subtotal,
                couponApplied: totals.eligible,
                discount: totals.discount,
                total: grandTotal,
                deliveryType: deliveryLabel,
                deliveryPrice: getDeliveryPriceLabel(),
                name, phone,
                wilaya: orderState.wilaya.name,
                baladiya: orderState.baladiya,
                notes: notes || null
            }, submitBtn, () => {
                cartState.items = [];
                updateCartBadge();
                showIosAlert({
                    title: 'تم استلام طلبك بنجاح ✅',
                    msg: 'وصلنا طلبك، وسيتواصل معك فريقنا قريباً لتأكيد التفاصيل وموعد التوصيل.',
                    btnText: 'حسناً',
                    onClose: () => closeOrder()
                });
            });
        };

        // =====================================================================
        // iOS-STYLE CONFIRMATION ALERT
        // =====================================================================
        function showIosAlert({ title, msg, btnText = 'حسناً', onClose } = {}) {
            const alertBackdrop = document.getElementById('ios-alert-backdrop');
            const alertBox = document.getElementById('ios-alert');
            alertBox.innerHTML = `
                <div class="ios-alert-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#4cd964" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 6L9 17l-5-5"/>
                    </svg>
                </div>
                <div class="ios-alert-title">${title}</div>
                <div class="ios-alert-msg">${msg}</div>
                <button class="ios-alert-btn" onclick="closeIosAlert()">${btnText}</button>
            `;
            alertBox.style.display = 'block';
            void alertBox.offsetWidth;
            alertBox.classList.add('active');
            alertBackdrop.classList.add('active');
            window._iosAlertOnClose = onClose || null;
        }
        window.closeIosAlert = function() {
            const alertBackdrop = document.getElementById('ios-alert-backdrop');
            const alertBox = document.getElementById('ios-alert');
            alertBox.classList.remove('active');
            alertBackdrop.classList.remove('active');
            setTimeout(() => { alertBox.style.display = 'none'; }, 560);
            if (window._iosAlertOnClose) { window._iosAlertOnClose(); window._iosAlertOnClose = null; }
        };

        // ============ Site credit badge behavior ============
        // - Appears bottom-right after the intro settles, showing "made by Jalil ."
        // - A few seconds later, sweep-fades into the Arabic version — this intro
        //   only ever plays once per page load.
        // - Fades off with a blur as soon as the user scrolls away from the top.
        // - Re-appears if they scroll back to the top, but (after that first
        //   intro has played) in a smaller, dimmer, non-animated-intro form.
        function initSiteCredit() {
            const badge = document.getElementById('site-credit');
            const textEl = document.getElementById('site-credit-text');
            if (!badge || !textEl) return;

            let introPlayed = false;

            setTimeout(() => { badge.classList.add('credit-visible'); }, 3000);

            setTimeout(() => {
                textEl.classList.add('credit-swap-out');
                setTimeout(() => {
                    textEl.textContent = 'صنع من طرف Jalil';
                    textEl.classList.remove('credit-swap-out');
                    introPlayed = true;
                }, 450);
            }, 5200);

            window.addEventListener('scroll', () => {
                const y = window.scrollY || window.pageYOffset;
                if (y > 80) {
                    badge.classList.add('credit-hidden');
                } else {
                    badge.classList.remove('credit-hidden');
                    if (introPlayed) badge.classList.add('credit-small');
                }
            }, { passive: true });
        }

        function renderSocialLinks() {
            const el = document.getElementById('ftc-social');
            if (!el) return;
            el.innerHTML = `
                <a href="${SOCIAL_LINKS.facebook}" target="_blank" rel="noopener" aria-label="فيسبوك">${icons.facebook}</a>
                <a href="${SOCIAL_LINKS.tiktok}" target="_blank" rel="noopener" aria-label="تيك توك">${icons.tiktok}</a>
            `;
        }

        // Init App & Animations
        document.addEventListener("DOMContentLoaded", () => {
            renderCards();
            renderSocialLinks();

            // Intro Animations
            setTimeout(() => { document.getElementById("logo-wrap").classList.add("moved"); }, 800); 
            setTimeout(() => { document.getElementById("top-text").classList.add("visible"); }, 1500);
            setTimeout(() => { document.getElementById("bottle-front").classList.add("visible"); }, 1700);
            setTimeout(() => {
                document.getElementById("bottle-mid-l").classList.add("visible");
                document.getElementById("bottle-mid-r").classList.add("visible");
            }, 1950);
            setTimeout(() => {
                document.getElementById("bottle-back-l").classList.add("visible");
                document.getElementById("bottle-back-r").classList.add("visible");
            }, 2200);
            setTimeout(() => {
                document.getElementById("bottom-content").classList.add("visible");
                document.getElementById("cart-fab").classList.add("visible");
                setupScroll();
            }, 2800);

            initSiteCredit();

            // Scroll Logic
            const logo = document.getElementById("logo-wrap");
            const glassBar = document.getElementById("top-glass-bar");
            
            function setupScroll() {
                let hasAutoScrolled = false;
                window.addEventListener("scroll", () => {
                    if (window.scrollY > 150) {
                        logo.classList.add("scrolled");
                        glassBar.classList.add("visible");
                    } else {
                        logo.classList.remove("scrolled");
                        glassBar.classList.remove("visible");
                    }

                    if (!hasAutoScrolled && window.scrollY > 40 && window.scrollY < window.innerHeight / 2) {
                        hasAutoScrolled = true; 
                        document.getElementById("products-section").scrollIntoView({ behavior: "smooth", block: "start" });
                    }
                });
            }

            // Scroll Observer for Cards
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) { entry.target.classList.add('reveal-visible'); }
                });
            }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

            setTimeout(() => {
                document.querySelectorAll('.reveal-element').forEach(el => observer.observe(el));
            }, 100);
        });
    </script>
